# Server properties
server:
  port: 8160

# Application metadata
info:
  app:
    environment: DEV
    name: ${spring.application.name}
    description: Email Service - Local Instance

# Spring properties
spring:
  application:
    name: comms-email
  profiles:
    active: dev
  config:
    import:
      - optional:configserver:discovery://config-server
      - optional:file:../env/dev.properties
  rabbitmq:
    host: ${RMQ_HOST}
    port: ${RMQ_PORT}
    username: ${RMQ_USERNAME}
    password: ${RMQ_PASSWORD}

# Service discovery properties
eureka:
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_DEFAULT_ZONE}
  instance:
    preferIpAddress: true

# Messaging properties
rabbitmq:
  queues:
    platform-emails: ${RMQ_PLATFORM_EMAILS_Q}

# AWS properties
aws:
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
  ses:
    region: ${AWS_REGION}

# Email properties
email:
  from-email: ${FROM_EMAIL}
  frontend-base-url: ${FRONTEND_BASE_URL}

# Management and observability properties
management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: info, health, refresh, prometheus
  endpoint:
    health:
      show-details: always
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      service.namespace: streamix
      deployment.environment: ${spring.profiles.active}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT}
  otlp:
    metrics:
      export:
        url: ${OTEL_METRICS_ENDPOINT}

# Logging properties
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.mariuszilinskas.streamix: DEBUG
