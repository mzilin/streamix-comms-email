# Application metadata
info:
  app:
    environment: ${spring.profiles.active}
    name: ${spring.application.name}
    description: Streamix Email Service

# Spring application and infrastructure configuration
spring:
  application:
    name: comms-email
  config:
    import:
      - optional:configserver:discovery://config-server
  datasource:
    url: jdbc:postgresql://localhost:5433/streamixdb
    driver-class-name: org.postgresql.Driver
    username: streamix
    password: streamix
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: streamix_email
  rabbitmq:
    host: localhost
    port: 5672
    username: streamix
    password: streamix

# Service discovery configuration
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      default-zone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

# Messaging configuration
rabbitmq:
  queues:
    platform-emails: platform-emails

# AWS configuration
aws:
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
  ses:
    region: eu-west-2

# Email configuration
email:
  from-email: ${FROM_EMAIL}
  frontend-base-url: http://localhost:3077

# Actuator and observability configuration
management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: info, health, prometheus
  endpoint:
    health:
      show-details: when-authorized
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      service.namespace: streamix
      deployment.environment: ${spring.profiles.active}
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

# Application logging configuration
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    com.mariuszilinskas.streamix: INFO
