# Server configuration
server:
  port: 8160

# Application metadata
info:
  app:
    environment: ${spring.profiles.active:default}
    name: ${spring.application.name}
    description: Streamix Email Service

# Spring application and infrastructure configuration
spring:
  application:
    name: comms-email
  config:
    import:
      - optional:configserver:discovery://config-server
  datasource:
    url: jdbc:postgresql://localhost:5433/streamixdb
    driver-class-name: org.postgresql.Driver
    username: streamix
    password: streamix
  flyway:
    enabled: true
    schemas:
      - streamix_email
    default-schema: streamix_email
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
    encoding: UTF-8
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: streamix_email
  rabbitmq:
    host: localhost
    port: 5672
    username: streamix
    password: streamix

# Service discovery configuration
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

# Messaging configuration
rabbitmq:
  queues:
    platform-emails: streamix.platform-emails

# AWS configuration
aws:
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
  ses:
    region: eu-west-2

# Email configuration
email:
  from-email: ${FROM_EMAIL}
  frontend-base-url: http://localhost:3077

# Actuator and observability configuration
management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: info, health, prometheus
  endpoint:
    health:
      show-details: when-authorized
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  opentelemetry:
    resource-attributes:
      service.namespace: streamix
      deployment.environment: ${spring.profiles.active:default}
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  tracing:
    sampling:
      probability: 1.0

# Application logging configuration
logging:
  level:
    root: INFO
    com.mariuszilinskas.streamix: INFO
    com.netflix: WARN
    org.apache.kafka: WARN
    org.springframework.amqp: WARN
    com.rabbitmq: WARN
    org.springframework.web.servlet: WARN